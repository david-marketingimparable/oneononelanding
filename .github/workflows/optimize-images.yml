name: Optimize website images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Convert referenced raster images to WebP
        run: python .github/scripts/optimize_images.py
      - name: Commit optimized images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets *.html *.css *.js
          if git diff --cached --quiet; then
            echo "No image changes required."
          else
            git commit -m "Optimize landing page images [skip ci]"
            git push
          fi
